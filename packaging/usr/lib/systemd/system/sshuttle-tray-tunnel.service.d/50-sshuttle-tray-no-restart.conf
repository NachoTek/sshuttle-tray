# sshuttle-tray: the Tool owns the Tunnel lifecycle (ADR 0001). A dead Tunnel
# must surface as the tray's Alert, never be papered over by a restart loop.
# Outvote this by shipping a same-named drop-in under
# /etc/systemd/system/sshuttle-tray-tunnel.service.d/ — /etc outranks /usr/lib.
[Service]
Restart=no
